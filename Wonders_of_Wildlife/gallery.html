<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Wildlife Gallery</title>
    <style>
        body {
            background-image: url('gallerybg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            font-family: "Cormorant", serif;
        }    
        .navbar {
            display: flex;
            justify-content: left;
            padding: 20px 90px;  
            position: relative;
        }
        .navbar ul {
            display: flex;
            list-style: none;
            gap: 50px;
            margin: 0;
            padding: 0;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
            padding: 0px 70px;
            transition: all 0.3s ease;
            font-family: "Cormorant", serif;
            font-size: 1.2rem;
        }
        .navbar a:hover {
            text-decoration: underline;
            text-underline-offset: 5px;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
        }
        h1 {     
            text-align: center;
            color: white;
            font-family: "Cormorant", serif;
            font-size: 50px;
            padding: 30px 20px;
            margin: 30px auto 40px;
            width: 80%;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 8px 18px rgba(0,0,0,0.35);
            backdrop-filter: blur(5px);
        }
        .gallery-images {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 0 50px 50px;
        }
        .img-card {
            position: relative;
            width: 300px;
            height: 370px;
            overflow: hidden;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }
        .img-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease, filter 0.4s ease;
        }
        .explore-btn {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2e7d32;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-family: "Cormorant", serif;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.4s ease;
            opacity: 0;
            white-space: nowrap;
            z-index: 10;
        }
        .img-card:hover {
            border-color: #4caf50;
        }
        .img-card:hover img {
            transform: scale(1.1);
            filter: brightness(70%);
        }
        .img-card:hover .explore-btn {
            bottom: 30px;
            opacity: 1;
        }
        .explore-btn:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="sanctuaries.html">Sanctuaries</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <h1>Wildlife Gallery</h1>
    <section class="gallery">
        <div class="gallery-images">
            <div class="img-card">
                <img src="image1.jpg" alt="Wildlife 1">
                <button class="explore-btn" onclick="location.href='image1.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image2.jpg" alt="Wildlife 2">
                <button class="explore-btn" onclick="location.href='image2.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image3.jpg" alt="Wildlife 3">
                <button class="explore-btn" onclick="location.href='image3.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image4.jpg" alt="Wildlife 4">
                <button class="explore-btn" onclick="location.href='image4.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image5.jpg" alt="Wildlife 5">
                <button class="explore-btn" onclick="location.href='image5.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image6.jpg" alt="Wildlife 6">
                <button class="explore-btn" onclick="location.href='image6.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image7.jpg" alt="Wildlife 7">
                <button class="explore-btn" onclick="location.href='image7.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image8.jpg" alt="Wildlife 8">
                <button class="explore-btn" onclick="location.href='image8.html'">Explore More</button>
            </div>
            <div class="img-card">
                <img src="image9.jpg" alt="Wildlife 9">
                <button class="explore-btn" onclick="location.href='image9.html'">Explore More</button>
            </div>
        </div>
    </section>
</body>
</html>
