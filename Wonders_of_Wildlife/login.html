<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="style1.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <title>Wonders of Wildlife</title>
  <style>
    .loginbg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .loginbg video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    body.login {
      font-family: "Cormorant", serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-main {
      width: 360px;
      padding: 40px;
      background-color: rgba(154, 205, 50, 0.94);
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      backdrop-filter: blur(5px);
    }
    .login-main h1 {
      color: #1e4620;
      margin-bottom: 15px;
      font-size: 30px;
    }
    .info-msg {
      background: rgba(255, 255, 255, 0.85);
      color: #1e4620;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 22px;
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .btn-action {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      box-sizing: border-box;
      transition: 0.3s;
    }
    .btn-public {
      background-color: #2e7d32;
      color: white;
      border: none;
    }
    .btn-public:hover {
      background-color: #1b5e20;
    }
    .btn-admin {
      background-color: #1565c0;
      color: white;
      border: none;
    }
    .btn-admin:hover {
      background-color: #0d47a1;
    }
  </style>
</head>
<body class="login">
  <div class="loginbg">
    <video autoplay loop muted playsinline> 
      <source src="loginbg.mp4" type="video/mp4">
    </video>
  </div>
  <div class="login-main">
    <h1>Wonders of Wildlife</h1>
    <div class="info-msg">
      ✨ <b>Notice:</b> Website login gate has been removed! The public website is now freely accessible without logging in.<br><br>
      Login authentication is now moved to the <b>Admin Panel</b> to add and delete sanctuaries and animals.
    </div>

    <a href="home.jsp" class="btn-action btn-public">🌿 Enter Public Website (No Login)</a>
    <a href="admin-login" class="btn-action btn-admin">🔒 Admin Panel Login</a>
  </div>
</body>
</html>
