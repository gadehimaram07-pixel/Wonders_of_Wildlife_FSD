            <h1>Sangai Deer</h1>
            <p>The Sangai Deer, also called the dancing deer, is found only in Manipur. It is famous for its graceful walk on the floating meadows of Loktak Lake.</p>
            <p><b>Scientific Name:</b> Rucervus eldii eldii</p>
            <p><b>Habitat:</b> Floating marshy grasslands</p>
            <p><b>Found In:</b> Keibul Lamjao National Park</p>
